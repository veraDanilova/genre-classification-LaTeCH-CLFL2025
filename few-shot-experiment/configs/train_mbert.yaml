# ---------------------------------------------------------------------------
# Training config: google-bert/bert-base-multilingual-cased (mBERT)
#                  MLM-finetuned on ActDisease
# ---------------------------------------------------------------------------

checkpoint: ../MLM-finetuning/output/mbert-ft-mlm/best_model

data_dir: data_few-shot-data
train_file: all__.train.csv
dev_file:   few_shot.dev.csv

output_dir: output

learning_rate: 1.0e-5
batch_size: 8
num_epochs: 5
weight_decay: 0.0
seed: 1234

hidden_dropout_prob: 0.1
attention_probs_dropout_prob: 0.25

use_wandb: false
wandb_project: few-shot-mbert-actdisease
